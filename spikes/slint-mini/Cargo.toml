# M0 startup spike: the mini view in Slint, to compare with Tauri (docs/perf.md).
# Standalone workspace so the main build and CI don't compile Slint.
[workspace]

[package]
name = "slint-mini"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

# Same release profile as the main workspace.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
