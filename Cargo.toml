[workspace]
resolver = "2"
members = ["crates/crate-core", "crates/crate-cli", "app"]

[workspace.package]
version = "0.2.20"
edition = "2024"
license = "MIT"
repository = "https://github.com/mlbrainlab/crate"
rust-version = "1.85"

[workspace.dependencies]
crate-core = { path = "crates/crate-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dependencies are optimized even in dev and test builds: age's scrypt,
# the compressors and Slint's software renderer are far too slow without.
# Crate's own crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: it filled CI's disk, and isn't needed.
debug = false
