<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crate — Glass theme, Windows 11 full view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased}
a{color:#1E3399}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{width:46px;height:32px;border:0;background:transparent;color:#1D2939;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cap:hover{background:rgba(0,0,0,.06)}
.capx:hover{background:#C42B1C;color:#fff}
.cb{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:5px;border:0;background:transparent;color:#0F172A;font:500 13px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.cb:hover{background:rgba(255,255,255,.65)}
.nav{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:5px;font-size:13px;font-weight:500;color:#1D2939;text-decoration:none}
.nav:hover{background:rgba(255,255,255,.55)}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 70px 130px;gap:10px;align-items:center;height:40px;padding:0 12px;border-radius:5px;font-size:13px;border:0;background:transparent;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.row:hover{background:rgba(255,255,255,.55)}
.tile{width:26px;height:26px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:10px;vertical-align:middle}
.dt{color:#334155;font-size:12px;font-weight:500}
.dd{margin:2px 0 0;font-weight:700;font-size:13px}
.seg{display:flex;gap:2px;padding:3px;border-radius:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.seg button{height:28px;padding:0 12px;border-radius:5px;border:0;background:transparent;color:#FFFFFF;font:600 12px/1 'Inter',sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:#FFFFFF;color:#0B2E6B}
.bar{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px}
</style>
</helmet>
<div style="font-family: 'Inter', system-ui, sans-serif; color: #0F172A; width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B2E6B">
<div aria-hidden="true" style="position: absolute; inset: 0">
<div style="position: absolute; left: -120px; top: -100px; width: 680px; height: 680px; border-radius: 50%; background: #2F80ED; filter: blur(90px); opacity: .9"></div>
<div style="position: absolute; right: -140px; top: 60px; width: 640px; height: 640px; border-radius: 50%; background: #56CCF2; filter: blur(90px); opacity: .75"></div>
<div style="position: absolute; left: 420px; bottom: -240px; width: 740px; height: 520px; border-radius: 50%; background: #7B61FF; filter: blur(100px); opacity: .85"></div>
<div style="position: absolute; left: 660px; top: 300px; width: 220px; height: 220px; border-radius: 50%; background: #B9E6FF; filter: blur(40px); opacity: .85"></div>
</div>
<div class="seg" role="group" aria-label="Window material" style="position: absolute; right: 60px; top: 10px; z-index: 3"><button aria-pressed="{{acrylicPressed}}" onClick="{{toAcrylic}}">Acrylic</button><button aria-pressed="{{micaPressed}}" onClick="{{toMica}}">Mica</button></div>

<section aria-label="Crate full view, glass theme on Windows" style="position: absolute; left: 60px; top: 52px; right: 60px; bottom: 44px; border-radius: 8px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; background: {{winBg}}; -webkit-backdrop-filter: {{winFx}}; backdrop-filter: {{winFx}}; border: 1px solid rgba(255,255,255,.55); box-shadow: 0 32px 64px rgba(0, 10, 40, .45), 0 2px 21px rgba(0, 10, 40, .2)">
<div style="display: flex; align-items: center; height: 32px; padding-left: 12px; gap: 8px">
<span style="width: 16px; height: 16px; border-radius: 4px; background: #3352E0; overflow: hidden"><svg viewBox="0 0 100 100" width="16" height="16" aria-hidden="true"><rect x="22" y="46" width="56" height="34" rx="5" fill="#FFFFFF"></rect><rect x="18" y="34" width="64" height="12" rx="4" fill="#DDE4FF" transform="rotate(-14 18 46)"></rect></svg></span>
<span style="flex: 1; font-size: 12px; font-weight: 500">project-assets.zip — Crate</span>
<button class="cap" aria-label="Minimize"><svg class="i" style="width: 14px; height: 14px; stroke-width: 1.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button class="cap" aria-label="Maximize"><svg class="i" style="width: 12px; height: 12px; stroke-width: 1.3" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
<button class="cap capx" aria-label="Close"><svg class="i" style="width: 14px; height: 14px; stroke-width: 1.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg></button>
</div>
<div role="toolbar" aria-label="Commands" style="display: flex; align-items: center; gap: 2px; margin: 4px 10px 0; padding: 4px 6px; border-radius: 8px; background: {{paneBg}}; border: 1px solid rgba(255,255,255,.9)">
<button class="cb" style="background: #3352E0; color: #fff; border-bottom: 1px solid #1E2F8F"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>Extract all</button>
<span style="width: 1px; height: 20px; background: rgba(15,23,42,.15); margin: 0 4px"></span>
<button class="cb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
<button class="cb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>New folder</button>
<button class="cb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Rename</button>
<button class="cb" style="color: #9B1C14"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M6 6l1 14h10l1-14"></path></svg>Delete</button>
<button class="cb"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>Test</button>
<label style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 5px; background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.95); border-bottom: 2px solid #8A94A6; width: 220px"><svg class="i" style="width: 14px; height: 14px; color: #475467" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="position: absolute; left: -9999px">Search</span><input type="text" placeholder="Search archive" style="border: 0; outline: none; font: 500 12px 'Inter', sans-serif; flex: 1; min-width: 0; background: transparent"></label>
</div>
<div style="flex: 1; min-height: 0; display: flex; gap: 10px; padding: 10px">
<nav aria-label="Archive tree" style="width: 230px; display: flex; flex-direction: column; gap: 2px">
<a class="nav" href="#" style="font-weight: 700"><svg class="i" style="color: #1E3399" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path><rect x="2" y="3" width="20" height="5" rx="1"></rect></svg>project-assets.zip</a>
<a class="nav" href="#" style="padding-left: 36px">design</a>
<a class="nav" href="#" style="padding-left: 36px">docs</a>
<a class="nav" href="#" aria-current="page" style="padding-left: 36px; background: rgba(255,255,255,.7); font-weight: 600"><span class="bar" style="background: #3352E0; left: 4px"></span>photos</a>
<a class="nav" href="#" style="padding-left: 36px">src</a>
<div style="margin-top: auto; border-radius: 8px; padding: 10px 12px; background: {{paneBg}}; border: 1px solid rgba(255,255,255,.9); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700">Glass theme<span style="margin-left: auto; font-size: 10px; letter-spacing: .06em; color: #FFFFFF; background: #1E2F8F; padding: 3px 6px; border-radius: 4px">PRO</span></div>
</nav>
<div style="flex: 1; min-width: 0; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; background: {{paneBg}}; border: 1px solid rgba(255,255,255,.9)">
<div class="row" style="cursor: default; height: 34px; color: #334155; font-weight: 600; font-size: 12px"><span>Name</span><span>Size</span><span>Packed</span><span>Ratio</span><span>Date modified</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<button class="row" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="background: {{r.bg}}"><span class="bar" style="background: {{r.bar}}"></span><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span class="tile" style="background: {{r.tb}}; color: {{r.tf}}">{{r.ext}}</span>{{r.name}}</span><span>{{r.size}}</span><span>{{r.packed}}</span><span>{{r.ratio}}</span><span>{{r.mod}}</span></button>
</sc-for>
</div>
<aside aria-label="Details" style="width: 260px; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; background: {{paneBg}}; border: 1px solid rgba(255,255,255,.9)">
<div style="height: 150px; border-radius: 6px; overflow: hidden"><svg viewBox="0 0 240 150" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true"><rect width="240" height="150" fill="{{f.p0}}"></rect><circle cx="180" cy="44" r="17" fill="{{f.p1}}"></circle><path d="M0 150 L0 106 L66 62 L114 102 L152 78 L240 128 L240 150 Z" fill="{{f.p2}}"></path></svg></div>
<div><div style="font-size: 15px; font-weight: 700; word-break: break-all">{{f.name}}</div><div class="dt" style="margin-top: 2px">photos\{{f.name}}</div></div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div><dt class="dt">Size</dt><dd class="dd">{{f.size}}</dd></div><div><dt class="dt">Packed</dt><dd class="dd">{{f.packed}}</dd></div>
<div><dt class="dt">Modified</dt><dd class="dd">{{f.mod}}</dd></div><div><dt class="dt">Ratio</dt><dd class="dd">{{f.ratio}}</dd></div>
</dl>
<div style="display: flex; gap: 8px; margin-top: auto"><button class="cb" style="flex: 1; justify-content: center; height: 34px; background: rgba(255,255,255,.85); border: 1px solid rgba(15,23,42,.12)">Open</button><button class="cb" style="flex: 1; justify-content: center; height: 34px; background: #3352E0; color: #fff">Extract</button></div>
</aside>
</div>
<div style="display: flex; align-items: center; gap: 14px; height: 28px; padding: 0 14px; font-size: 12px; font-weight: 500; color: #1D2939"><span>1 of 10 selected · {{f.size}}</span><span style="margin-left: auto">{{effectNote}}</span></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focus: 3, mica: false }; }
  renderVals() {
    const m = this.state.mica;
    const PH = [['#CFE0F2', '#F6C453', '#6E8FB8'], ['#F3D9B8', '#F08A4B', '#B9774A'], ['#D5E8D4', '#FFFFFF', '#5E9A6A']];
    const T = { dir: ['rgba(51,82,224,.16)', '#1E3399'], img: ['rgba(14,122,79,.16)', '#0B5E3C'], doc: ['rgba(194,38,27,.14)', '#9B1C14'], txt: ['rgba(15,23,42,.06)', '#334155'], vid: ['rgba(180,83,9,.16)', '#8A3E05'] };
    const data = [
      { name: 'raw', t: 'dir', ext: 'DIR', size: '1.2 GB', packed: '1.1 GB', ratio: '8%', mod: '02/10/2026 09:12', p: 0 },
      { name: 'edits', t: 'dir', ext: 'DIR', size: '384 MB', packed: '301 MB', ratio: '22%', mod: '09/10/2026 17:40', p: 1 },
      { name: 'IMG_2041.jpg', t: 'img', ext: 'JPG', size: '6.4 MB', packed: '6.3 MB', ratio: '2%', mod: '02/10/2026 14:12', p: 0 },
      { name: 'cover-final.png', t: 'img', ext: 'PNG', size: '12.8 MB', packed: '9.1 MB', ratio: '29%', mod: '11/10/2026 18:02', p: 1 },
      { name: 'IMG_2043.heic', t: 'img', ext: 'HEIC', size: '3.1 MB', packed: '3.1 MB', ratio: '0%', mod: '02/10/2026 14:15', p: 2 },
      { name: 'model-release.pdf', t: 'doc', ext: 'PDF', size: '2.1 MB', packed: '1.8 MB', ratio: '14%', mod: '04/10/2026 11:47', p: 0 },
      { name: 'shoot-notes.md', t: 'txt', ext: 'MD', size: '4.2 KB', packed: '1.6 KB', ratio: '62%', mod: '03/10/2026 09:20', p: 2 },
      { name: 'timelapse.mp4', t: 'vid', ext: 'MP4', size: '412 MB', packed: '408 MB', ratio: '1%', mod: '05/10/2026 20:58', p: 1 }
    ];
    const fi = this.state.focus;
    const rows = data.map((d, i) => { const on = i === fi; return { ...d, tb: T[d.t][0], tf: T[d.t][1], pressed: on ? 'true' : 'false', bg: on ? 'rgba(255,255,255,.75)' : 'transparent', bar: on ? '#3352E0' : 'transparent', pick: () => this.setState({ focus: i }) }; });
    const d = data[fi] || data[0]; const ph = PH[d.p];
    return {
      rows, f: { ...d, p0: ph[0], p1: ph[1], p2: ph[2] },
      winBg: m ? 'rgba(232,238,250,.95)' : 'rgba(245,248,255,.42)',
      winFx: m ? 'none' : 'blur(32px) saturate(160%)',
      paneBg: m ? 'rgba(255,255,255,.72)' : 'rgba(255,255,255,.58)',
      effectNote: m ? 'Mica: tinted by the wallpaper, opaque — best for long sessions' : 'Acrylic: see-through blur — the full glass look',
      acrylicPressed: m ? 'false' : 'true', micaPressed: m ? 'true' : 'false',
      toAcrylic: () => this.setState({ mica: false }), toMica: () => this.setState({ mica: true })
    };
  }
}
</script>
</body>
</html>
