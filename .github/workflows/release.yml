name: Release

# Pushing a version tag (v0.1.0) builds the Linux packages and publishes a
# GitHub Release with them, SHA256SUMS, and the CHANGELOG section as notes.
# Run it by hand (Actions → Release → Run workflow) for a dry run: the
# packages come out as a workflow artifact and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux packages
    # The oldest supported runner: glibc 2.35, so the packages run on most
    # current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev liblzma-dev \
            desktop-file-utils appstream libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Packaging tools
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          sudo curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod 755 /usr/local/bin/appimagetool

      - name: Tests
        run: cargo test --workspace

      - name: Packages
        run: scripts/package-linux.sh

      - name: "Dry run: keep the packages as an artifact"
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/dist/

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md > target/dist/NOTES.md
          [ -s target/dist/NOTES.md ] || { echo "No section for $version in CHANGELOG.md"; exit 1; }

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          name: Crate ${{ github.ref_name }}
          body_path: target/dist/NOTES.md
          files: |
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.AppImage
            target/dist/SHA256SUMS
