name: Release

# Pushing a version tag (v0.1.0) builds the Linux packages, the Windows
# installer and the signed, notarized macOS .dmg, and publishes a GitHub
# Release with all of them, SHA256SUMS, and the CHANGELOG section as notes.
# Run it by hand (Actions → Release → Run workflow) for a dry run: the
# packages come out as workflow artifacts and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: without debug info the test build fits the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The Pro license signer's address (app/src/license.rs), a repository
  # variable. Empty until the signer is deployed: builds then take only
  # signed keys.
  CRATE_LICENSE_URL: ${{ vars.CRATE_LICENSE_URL }}
  # The Lemon Squeezy checkout for Crate Pro (app/src/pro.rs); empty hides Buy.
  CRATE_BUY_URL: ${{ vars.CRATE_BUY_URL }}

jobs:
  linux:
    name: Linux packages
    # The oldest supported runner: glibc 2.35, so the packages run on most
    # current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev liblzma-dev \
            desktop-file-utils appstream libfuse2

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache: ci.yml's job is also called "linux" but builds on a
      # newer Ubuntu, and sharing its cache broke the build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ubuntu-22.04

      - name: Packaging tools
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          sudo curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod 755 /usr/local/bin/appimagetool

      - name: Tests
        run: cargo test --workspace

      - name: Packages
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/dist/

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Tests
        run: cargo test --workspace

      - name: Installer
        run: pwsh scripts/package-windows.ps1

      # Install it for the current user, check what it registered, and
      # uninstall again.
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\dist\Crate-*-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Crate"
          & "$app\crate.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "crate.exe didn't run" }
          $registered = (Get-ItemProperty HKCU:\Software\RegisteredApplications).Crate
          if ($registered -ne 'Software\Crate\Capabilities') { throw "not in RegisteredApplications: $registered" }
          $zip = (Get-ItemProperty HKCU:\Software\Crate\Capabilities\FileAssociations).'.zip'
          if ($zip -ne 'Crate.Archive') { throw "no .zip association: $zip" }
          $verb = (Get-ItemProperty 'HKCU:\Software\Classes\SystemFileAssociations\.7z\shell\Crate.Extract\command').'(default)'
          if ($verb -notlike '*crate-app.exe" --extract-each "%1"') { throw "Extract verb: $verb" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path HKCU:\Software\Crate); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path HKCU:\Software\Crate) { throw "uninstall left Software\Crate" }
          if (Test-Path "$app\crate-app.exe") { throw "uninstall left crate-app.exe" }
          Write-Host "Installed, registered and uninstalled cleanly."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/dist/

  # Signed with the Developer ID certificate and notarized when the secrets
  # are there (docs/macos-signing.md); a release needs them.
  macos:
    name: macOS disk image
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }
          [ -n "$MACOS_SIGN_IDENTITY" ] && [ -n "$APPLE_API_KEY_P8" ] || {
            echo "A release needs the signing and notarization secrets"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Tests
        run: cargo test --workspace

      # A keychain of its own for the certificate, searched by codesign, and
      # the notary key as a file; both live in RUNNER_TEMP, which goes away
      # with the runner.
      - name: Signing certificate and notary key
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Disk image
        run: scripts/package-macos.sh

      # Mount it and run what's inside, on this runner's architecture and
      # the other one's (Rosetta).
      - name: Mount and check
        run: |
          set -euo pipefail
          dmg=$(ls target/dist/Crate-*-universal.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          app="$mnt/Crate.app"
          codesign --verify --strict --verbose=2 "$app"
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            # What Gatekeeper says on a downloaded copy.
            spctl --assess --type execute --verbose=2 "$app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          fi
          "$app/Contents/MacOS/crate" --version
          arch -x86_64 "$app/Contents/MacOS/crate" --version
          test -L "$mnt/Applications"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/dist/

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Files, checksums and notes
        run: |
          mkdir -p dist
          cp artifacts/linux-packages/*.deb artifacts/linux-packages/*.rpm \
            artifacts/linux-packages/*.AppImage artifacts/windows-installer/*.exe \
            artifacts/macos-dmg/*.dmg dist/
          cat artifacts/*/SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md > NOTES.md
          [ -s NOTES.md ] || { echo "No section for $version in CHANGELOG.md"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: Crate ${{ github.ref_name }}
          body_path: NOTES.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/SHA256SUMS
