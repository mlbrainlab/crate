name: Release

# Pushing a version tag (v0.1.0) builds the Linux packages, the Windows
# installer and the macOS .dmg, and publishes a GitHub Release with the
# Linux and Windows ones, SHA256SUMS, and the CHANGELOG section as notes.
# Run it by hand (Actions → Release → Run workflow) for a dry run: the
# packages come out as workflow artifacts and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: without debug info the test build fits the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Linux packages
    # The oldest supported runner: glibc 2.35, so the packages run on most
    # current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev liblzma-dev \
            desktop-file-utils appstream libfuse2

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache: ci.yml's job is also called "linux" but builds on a
      # newer Ubuntu, and sharing its cache broke the build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ubuntu-22.04

      - name: Packaging tools
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          sudo curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod 755 /usr/local/bin/appimagetool

      - name: Tests
        run: cargo test --workspace

      - name: Packages
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/dist/

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Tests
        run: cargo test --workspace

      - name: Installer
        run: pwsh scripts/package-windows.ps1

      # Install it for the current user, check what it registered, and
      # uninstall again.
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\dist\Crate-*-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Crate"
          & "$app\crate.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "crate.exe didn't run" }
          $registered = (Get-ItemProperty HKCU:\Software\RegisteredApplications).Crate
          if ($registered -ne 'Software\Crate\Capabilities') { throw "not in RegisteredApplications: $registered" }
          $zip = (Get-ItemProperty HKCU:\Software\Crate\Capabilities\FileAssociations).'.zip'
          if ($zip -ne 'Crate.Archive') { throw "no .zip association: $zip" }
          $verb = (Get-ItemProperty 'HKCU:\Software\Classes\SystemFileAssociations\.7z\shell\Crate.Extract\command').'(default)'
          if ($verb -notlike '*crate-app.exe" --extract-each "%1"') { throw "Extract verb: $verb" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path HKCU:\Software\Crate); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path HKCU:\Software\Crate) { throw "uninstall left Software\Crate" }
          if (Test-Path "$app\crate-app.exe") { throw "uninstall left crate-app.exe" }
          Write-Host "Installed, registered and uninstalled cleanly."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/dist/

  # Built and checked on every run, but not published yet: the .dmg joins
  # the release once it's signed and notarized (M8).
  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Tests
        run: cargo test --workspace

      - name: Disk image
        run: scripts/package-macos.sh

      # Mount it and run what's inside, on this runner's architecture and
      # the other one's (Rosetta).
      - name: Mount and check
        run: |
          dmg=$(ls target/dist/Crate-*-universal.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          app="$mnt/Crate.app"
          codesign --verify --strict --verbose=2 "$app"
          "$app/Contents/MacOS/crate" --version
          arch -x86_64 "$app/Contents/MacOS/crate" --version
          test -L "$mnt/Applications"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/dist/

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Files, checksums and notes
        run: |
          mkdir -p dist
          cp artifacts/linux-packages/*.deb artifacts/linux-packages/*.rpm \
            artifacts/linux-packages/*.AppImage artifacts/windows-installer/*.exe dist/
          cat artifacts/*/SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md > NOTES.md
          [ -s NOTES.md ] || { echo "No section for $version in CHANGELOG.md"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: Crate ${{ github.ref_name }}
          body_path: NOTES.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/SHA256SUMS
