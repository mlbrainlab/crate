name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI only needs pass/fail: no debug info keeps target/ within the disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Ubuntu (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build without UnRAR (free-software-only builds)
        run: cargo check -p crate-core -p crate-cli --no-default-features

  windows:
    name: Windows (clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Windows builds are slow: keep what compiled even when a step fails.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test binary, so one failure doesn't hide the others.
      - run: cargo test --workspace --no-fail-fast

      - name: Keep the UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-snapshots
          path: target/ui-snapshots/
          if-no-files-found: ignore

  macos:
    name: macOS (clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

      - name: Keep the UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-snapshots
          path: target/ui-snapshots/
          if-no-files-found: ignore

  fuzz:
    name: Fuzz the archive readers (30 s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crate-core/fuzz

      - name: cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Fuzz
        working-directory: crates/crate-core/fuzz
        run: |
          for target in zip tar tar_gz sevenz; do
            mkdir -p "/tmp/corpus/$target"
            cargo fuzz run "$target" "/tmp/corpus/$target" "corpus/$target" -- \
              -max_total_time=30 -max_len=65536 -rss_limit_mb=2048
          done

      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/crate-core/fuzz/artifacts/
