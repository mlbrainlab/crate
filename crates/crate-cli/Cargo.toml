[package]
name = "crate-cli"
description = "Command-line companion for Crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "crate"
path = "src/main.rs"

[dependencies]
crate-core.workspace = true
ctrlc = "3"

[dev-dependencies]
bzip2 = "0.6"
crc32fast = "1"
encoding_rs = "0.8"
flate2 = "1"
liblzma = "0.4"
sevenz-rust2 = "0.24"
tar = "0.4"
tempfile = "3"
zip = "9"
zstd = "0.14"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
