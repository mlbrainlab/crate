[package]
name = "crate-cli"
description = "Command-line companion for Crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "crate"
path = "src/main.rs"

[dependencies]
crate-core.workspace = true
ctrlc = "3"

[dev-dependencies]
crc32fast = "1"
encoding_rs = "0.8"
tempfile = "3"
zip = "9"
