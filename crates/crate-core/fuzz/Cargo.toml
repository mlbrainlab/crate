# Fuzzing the archive readers with cargo-fuzz (needs a nightly toolchain):
#
#   cargo install cargo-fuzz
#   cd crates/crate-core/fuzz && cargo +nightly fuzz run zip -- -max_total_time=60
#
# Its own workspace, so the main build never sees libfuzzer.
[package]
name = "crate-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
# Without UnRAR: RAR goes through a C++ library fuzzing can't instrument.
crate-core = { path = "..", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar"
path = "fuzz_targets/tar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar_gz"
path = "fuzz_targets/tar_gz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sevenz"
path = "fuzz_targets/sevenz.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
